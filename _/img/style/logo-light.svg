<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 120" width="460" height="120">
  <!-- Light-theme variant of logo.svg. Geometry is identical; only the
       theme-dependent colours change to match the light tokens in
       supplemental-ui/css/style.css:
         backdrop  = #ffffff (header background), border #e2e8f0
         wordmark  = #0f172a (heading) / #0369a1..#0284c7 (info, sky-600)
         subtitle  = #64748b (muted text)
       The badge stays dark so the brand mark is identical in both themes. -->
  <defs>
    <linearGradient id="k8sFleetGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#326CE5" />
      <stop offset="55%" stop-color="#0EA5E9" />
      <stop offset="100%" stop-color="#22D3EE" />
    </linearGradient>
    <linearGradient id="accentGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22D3EE" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>
    <!-- Darker cyan for the wordmark, which sits on a white backdrop. -->
    <linearGradient id="wordmarkGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0369A1" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>
  </defs>

  <!-- Light rounded backdrop with the site's standard border -->
  <rect x="1" y="1" width="458" height="118" rx="15" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2" />

  <!-- Kubernetes-inspired 7-Sided Heptagon Badge (unchanged mark) -->
  <g transform="translate(16, 12)">
    <polygon points="48,4 86,22 95,63 69,94 27,94 1,63 10,22" fill="#0F172A" stroke="url(#k8sFleetGrad)" stroke-width="5" stroke-linejoin="round" />

    <!-- Orchestration Spokes (Subtle Fleet Grid) -->
    <line x1="48" y1="4" x2="48" y2="26" stroke="#326CE5" stroke-width="2.5" stroke-linecap="round" opacity="0.6" />
    <line x1="86" y1="22" x2="68" y2="36" stroke="#326CE5" stroke-width="2.5" stroke-linecap="round" opacity="0.6" />
    <line x1="10" y1="22" x2="28" y2="36" stroke="#326CE5" stroke-width="2.5" stroke-linecap="round" opacity="0.6" />
    <line x1="69" y1="94" x2="60" y2="74" stroke="#326CE5" stroke-width="2.5" stroke-linecap="round" opacity="0.6" />
    <line x1="27" y1="94" x2="36" y2="74" stroke="#326CE5" stroke-width="2.5" stroke-linecap="round" opacity="0.6" />

    <!-- Stylized 'i8t' Monogram Inside Heptagon -->
    <!-- 'i' -->
    <circle cx="25" cy="37" r="3.5" fill="#22D3EE" />
    <rect x="22" y="45" width="6" height="24" rx="3" fill="#F8FAFC" />

    <!-- '8' (Infinity/Cluster Loops) -->
    <circle cx="48" cy="43" r="8.5" fill="none" stroke="url(#accentGlow)" stroke-width="5" />
    <circle cx="48" cy="61" r="9.5" fill="none" stroke="url(#accentGlow)" stroke-width="5" />

    <!-- 't' -->
    <path d="M70,34 V63 C70,67 72,69 76,69" fill="none" stroke="#F8FAFC" stroke-width="5.5" stroke-linecap="round" />
    <line x1="63" y1="46" x2="77" y2="46" stroke="#22D3EE" stroke-width="5" stroke-linecap="round" />
  </g>

  <!-- Primary Brand Wordmark: infrafleet -->
  <text x="132" y="66" font-family="system-ui, -apple-system, &#39;Segoe UI&#39;, Roboto, Helvetica, Arial, sans-serif" font-size="42" font-weight="800" letter-spacing="-1" fill="#0F172A">
    infra<tspan fill="url(#wordmarkGrad)">fleet</tspan>
  </text>

  <!-- Subtitle / Numeronym Tag -->
  <text x="134" y="90" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="13" font-weight="600" letter-spacing="2.5" fill="#64748B">
    <tspan>[i8t] DEVOPS</tspan>
    <tspan>&amp;</tspan>
  <tspan>INFRASTRUCTURE</tspan>
  </text>
</svg>
